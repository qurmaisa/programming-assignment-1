<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Калькулятор Массы Титана</h1>
        
        <div class="input-group">
            <label>Имя разведчика:</label>
            <input type="text" id="scoutName" placeholder="Имя">
        </div>

        <div class="input-group">
            <label>Рост титана (м):</label>
            <input type="number" id="titanHeight" placeholder="Например: 15">
        </div>

        <div class="input-group">
            <label>Ширина титана (м):</label>
            <input type="number" id="titanWidth" placeholder="Например: 4">
        </div>

        <div class="input-group checkbox-group">
            <input type="checkbox" id="isAbnormal">
            <label for="isAbnormal">Аномальное поведение?</label>
        </div>

        <button id="calculateBtn">Провести анализ</button>

        <div id="output">
            <h2 id="greeting"></h2>
            <p id="massResult"></p>
            <p id="classification"></p>
            <p id="abnormalWarning"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
