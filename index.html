<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Калькулятор Массы</h1>
        
        <div class="input-group">
            <label>Имя разведчика:</label>
            <input type="text" id="scoutName" placeholder="Например: Армин">
        </div>

        <div class="input-group">
            <label>Рост титана (м):</label>
            <input type="number" id="titanHeight" placeholder="Например: 15">
        </div>

        <div class="input-group">
            <label>Ширина титана (м):</label>
            <input type="number" id="titanWidth" placeholder="Например: 4">
        </div>

        <div class="input-group checkbox-group">
            <input type="checkbox" id="isAbnormal">
            <label for="isAbnormal">Аномальное поведение?</label>
        </div>

        <div class="button-group">
            <button id="calculateBtn">Провести анализ</button>
            <button id="resetBtn">Новая цель</button>
        </div>

        <div id="output">
            <h2 id="greeting"></h2>
            <img id="titanImage" src="" alt="Фоторобот Титана" style="display: none;">
            
            <p id="massResult"></p>
            <p id="classification"></p>
            <p id="abnormalWarning"></p>

            <div id="meterContainer" style="display: none;">
                <p style="margin-bottom: 5px; color: #ccc;">Уровень угрозы:</p>
                <div class="meter-bg">
                    <div id="dangerMeter" class="meter-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
